// YWB 10/10/03:
// If the user doesn't have a config.cfg when they run, this gets executed the first time they run the engine
// It doesn't execute if they have their own config.cfg saved out.

// halfcraft: every chapter open in New Game from the first start
sv_unlockedchapters 15

// halfcraft: the keys as minecraft has them, rebindable in the keyboard options (scripts/kb_act.lst,
// "Use defaults" there reads scripts/kb_def.lst: keep the two alike). minecraft's own controls
// stay at its defaults; the client translates half-life's bindings into them.
unbindall

bind "ESCAPE" 		"cancelselect"
bind "`" 			"toggleconsole"

// movement (sneak on shift and sprint on control, like minecraft)
bind "w"			"+forward"
bind "s"			"+back"
bind "a"			"+moveleft"
bind "d"			"+moveright"
bind "SPACE"		"+jump"
bind "SHIFT"		"+duck"
bind "CTRL"			"+speed"

// minecraft
bind "MOUSE1"		"+attack"
bind "MOUSE2"		"+attack2"
bind "MOUSE3"		"+hc_pickblock"
bind "e"			"+hc_inventory"
bind "q"			"+hc_drop"
bind "f"			"+hc_swaphands"
bind "1"			"slot1"
bind "2"			"slot2"
bind "3"			"slot3"
bind "4"			"slot4"
bind "5"			"slot5"
bind "6"			"slot6"
bind "7"			"slot7"
bind "8"			"slot8"
bind "9"			"slot9"
bind "MWHEELUP"		"invprev"
bind "MWHEELDOWN"	"invnext"
bind "F4"			"hc_creative"
bind "F5"			"+hc_perspective"
bind "t"			"+hc_chat"
bind "/"			"+hc_command"
bind "l"			"+hc_advancements"
bind "F1"			"+hc_hidehud"
bind "F3"			"+hc_debug"

// half-life
bind "g"			"+use"
bind "r"			"hc_gravitygun"
bind "v"			"impulse 100"
bind "c"			"impulse 50"
bind "F6"			"save quick"
bind "F9"			"load quick"
bind "F10"			"quit prompt"

//bind both keys to pause command for legacy support
bind "PAUSE" 		"pause"
bind "NUMLOCK" 		"pause"

// on Mac don't cause CTRL to be bound as it doesn't play well with mouse wheel
// F9 is Expose by default so move it to F8 on Mac
bind_mac "F8"			"load quick"
unbind_mac "F9"

